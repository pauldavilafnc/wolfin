const MCU={};
function mcUrl(k){if(!MCU[k]){const b=atob(MCB[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);MCU[k]=URL.createObjectURL(new Blob([u],{type:'image/webp'}))}return MCU[k]}
const LV=[{"n":"Mendigo","d":"Bolso vazio e muita história para contar. Todo magnata começa em algum lugar.","q":"Ponto de partida"},{"n":"Liso","d":"Sem dinheiro, mas já com o pé no caminho certo.","q":"1 mês fechado no azul"},{"n":"Na média","d":"Vida em ordem, contas sob controle e celular na mão.","q":"3 meses seguidos no azul"},{"n":"Bem de vida","d":"Dá até para pedir sobremesa sem olhar o preço.","q":"6 meses seguidos no azul e reserva de 1 mês de gastos"},{"n":"Patrão","d":"Quem manda no próprio dinheiro: terno, óculos e pasta.","q":"12 meses seguidos no azul, reserva de 3 meses e nenhuma dívida vencida"},{"n":"Magnata","d":"O topo: contas em dia, reserva cheia e brilho no olhar.","q":"18 meses seguidos no azul, reserva de 6 meses e nenhuma dívida vencida"}];
/* regras de progresso (acumulado): m = meses fechados SEGUIDOS no azul · r = reserva (caixinhas) em meses de gastos · d = exige nenhuma dívida vencida */
const LVR=[{m:0,r:0,d:0},{m:1,r:0,d:0},{m:3,r:0,d:0},{m:6,r:1,d:0},{m:12,r:3,d:1},{m:18,r:6,d:1}];
function lvStats(){const f=flows(),td=todayStr(),cm=td.slice(0,7),blue=k=>!!f[k]&&f[k].inc>0&&f[k].inc>=f[k].exp;
 let m=0,k=shift(cm,-1);while(m<600&&blue(k)){m++;k=shift(k,-1)}
 const ex=[];for(let i=1;i<=6&&ex.length<3;i++){const x=f[shift(cm,-i)];if(x&&x.exp>0)ex.push(x.exp)}
 const avg=ex.length?sum(ex,x=>x)/ex.length:0,res=sum(S.boxes,savedOf),rm=avg>0?res/avg:0,ld=S.debts.some(x=>balOf(x)>0&&x.due&&x.due<td);
 return{m,rm,ld,res,avg}}
const lvOk=(n,s)=>{const r=LVR[n-1];return s.m>=r.m&&s.rm>=r.r&&!(r.d&&s.ld)};
function lvCalc(){const s=lvStats();let n=1;for(let i=6;i>=1;i--)if(lvOk(i,s)){n=i;break}return{lv:n,s}}
function lvNeed(n){const s=lvCalc().s,r=LVR[n-1],a=[];if(s.m<r.m){const d=r.m-s.m;a.push(`mais ${d} ${d===1?'mês fechado':'meses fechados'} no azul, seguidos`)}if(s.rm<r.r)a.push(`reserva de ${r.r} ${r.r===1?'mês':'meses'} de gastos (hoje ${s.rm.toFixed(1).replace('.',',')})`);if(r.d&&s.ld)a.push('quitar as dívidas vencidas');return a}
function lvNextLine(){const c=lvCalc().lv;if(c>=6)return 'Você chegou ao nível máximo. Agora é manter o ritmo!';const n=lvNeed(c+1);return 'Próxima roupa: '+LV[c].n+(n.length?'. Faltam: '+n.join(' · ')+'.':'.')}
/* roupas liberadas ficam suas para sempre (S.pref.lv só sobe); a roupa mostrada segue a situação atual (modo automático) ou a escolha (S.pref.lm='m') */
function lvSync(){const p=S.pref,c=lvCalc().lv,init=!p.lv;if(c>(p.lv||0)){p.lv=c;return init?0:c}if(init)p.lv=c;return 0}
const lvTop=()=>Math.max(S.pref.lv||1,lvCalc().lv);
function lvShow(){const p=S.pref,c=lvCalc().lv;if(p.lm==='m'&&p.lp>=1&&p.lp<=Math.max(p.lv||1,c))return p.lp;return c}
function lookLv(){try{const l=JSON.parse(localStorage.getItem('wallstreet.look')),v=Math.floor(+(l&&l.v));return v>=1&&v<=6?v:3}catch(e){return 3}}
function mcCur(){if(SECMODE&&!DEK)return lookLv();return lvShow()}
const lvAvLbl=n=>`Meu mascote: Wolfin, nível ${n}, ${LV[n-1].n}. Toque para trocar a roupa`;
/* avatar = recorte do rosto da MESMA imagem do busto (nunca uma imagem separada) */
function mcAv(n,sz){return `<span class="mcav" style="width:${sz}px;height:${sz}px" aria-hidden="true"><img src="${mcUrl('b'+n)}" alt="" draggable="false" style="width:131.6%;left:-23.7%;top:0"></span>`}
/* mascote animado: respiração e leve balanço da cabeça (só transform; desligado com "reduzir movimento") */
function loboHtml(n,kind,cls){const v=LV[n-1],f=kind==='f';
 return `<div class="wolf mc ${f?'full ':''}${cls||''}" data-mc="wolfin" data-lv="${n}" role="img" aria-label="Wolfin, seu mascote, nível ${n}: ${esc(v.n)}. ${esc(v.d)}" style="--hp:7s;--ha:.8deg;--hy:.4%;--br:.006"><div class="mcw"><div class="mci"><img class="mcb" src="${mcUrl((f?'f':'b')+n)}" alt="" draggable="false"></div></div></div>`}
/* galeria "Roupas do Wolfin": modo automático ou escolher; as roupas ainda bloqueadas mostram o que falta */
let LVT={m:'a',p:1};
function lvSheet(keep){const o=$('#ov'),old=keep&&o.querySelector('.lvlist'),sc=old?old.scrollTop:0,fa=keep?document.activeElement:null,fk=fa&&fa.dataset&&fa.dataset.act?[fa.dataset.act,fa.dataset.id||'']:null,cur=lvShow(),top=lvTop(),n=LVT.m==='m'?Math.min(LVT.p,top):cur,v=LV[n-1];
 const cards=LV.map((x,i)=>{const k=i+1,lock=k>top,on=k===n;return `<button type="button" role="radio" aria-checked="${on}" class="lvc${on?' on':''}${lock?' lock':''}"${lock?' aria-disabled="true"':''} data-act="lvpick" data-id="${k}" aria-label="${esc(x.n)}, nível ${k}${lock?', bloqueada. Para liberar: '+esc(x.q):', liberada'}"><span class="lvi"><img src="${mcUrl('f'+k)}" alt="" draggable="false"></span><b>${esc(x.n)}</b><small>${lock?'Bloqueada':'Nível '+k}</small>${lock?`<span class="lvq">${esc(x.q)}</span>`:''}</button>`}).join('');
 o.innerHTML=`<div class="sheet lvs" role="dialog" aria-modal="true" aria-label="Roupas do Wolfin"><h3>Roupas do Wolfin</h3><div class="mcpv">${loboHtml(n,'b','prev')}<div class="mcpi"><b>Nível ${n} · ${esc(v.n)}</b><span class="mcd">${esc(v.d)}</span></div></div><p class="lbl lvn">${esc(lvNextLine())}</p><div class="lvseg" role="radiogroup" aria-label="Como escolher a roupa"><button type="button" role="radio" aria-checked="${LVT.m==='a'}" class="${LVT.m==='a'?'on':''}" data-act="lvmode" data-id="a">Automática</button><button type="button" role="radio" aria-checked="${LVT.m==='m'}" class="${LVT.m==='m'?'on':''}" data-act="lvmode" data-id="m">Escolher</button></div><p class="lbl lvh">${LVT.m==='a'?'A roupa muda sozinha conforme a sua situação. Se ela piorar, o Wolfin volta a uma roupa mais simples. As roupas que você já liberou continuam suas.':'Escolha qualquer roupa já liberada. Ela fica fixa até você voltar para o modo automático.'}</p><div class="lvlist lvgrid" role="radiogroup" aria-label="Roupas">${cards}</div><div class="btns" style="margin-top:14px"><button class="b2" data-act="close">Cancelar</button><button class="b1" data-act="lvok">Confirmar</button></div></div>`;o.hidden=false;
 const l=o.querySelector('.lvlist');if(l&&sc)l.scrollTop=sc;if(fk){const t=o.querySelector(`[data-act="${fk[0]}"][data-id="${fk[1]}"]`);if(t)try{t.focus({preventScroll:true})}catch(e){}}}

/* ===== SEGURANÇA: usuário + senha, dados criptografados (AES-256-GCM, chave derivada por PBKDF2) =====
   • Os dados ficam cifrados no aparelho com uma chave aleatória (DEK). A DEK fica guardada "embrulhada" duas vezes:
     pela senha e pelo código de recuperação. Trocar a senha não exige recifrar os dados.
   • A chave só existe na memória enquanto o app está aberto; fechar/recarregar = bloqueado.
   • Não há e-mail: o site não tem servidor. A recuperação é pelo código de 20 caracteres, mostrado uma única vez. */
const hasCrypto=!!(window.crypto&&crypto.subtle),enc=new TextEncoder(),dec=new TextDecoder(),SECK='wallstreet.sec',FK='wallstreet.fail',ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',LK=$('#lock');

const nu=u=>String(u||'').trim().toLowerCase().normalize('NFKC'),np=p=>String(p||'').normalize('NFKC');
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)},ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const newCode=()=>{let t='';for(const x of rnd(20))t+=ALF[x&31];return t.match(/.{4}/g).join('-')},normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

const seal=async(k,by)=>{const iv=rnd(12);return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,by)))}};
const unseal=async(k,o)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct)));
const pwKey=(u,p,salt,it)=>kdf(nu(u)+'\n'+np(p),ub64(salt),it);
async function openRaw(sec,raw){const dek=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);return{raw,dek,data:JSON.parse(dec.decode(await unseal(dek,sec.d)))}}
async function tryPw(sec,u,p){let raw;try{raw=await unseal(await pwKey(u,p,sec.s,sec.it),sec.w)}catch(e){return null}return openRaw(sec,raw)}
async function tryCode(sec,c){let raw;try{raw=await unseal(await kdf(normCode(c),ub64(sec.rs),sec.ri),sec.r)}catch(e){return null}return openRaw(sec,raw)}
async function wrapAll(u,p,raw,newRec,old){const salt=rnd(16),sec={v:1,u:nu(u),it:600000,s:b64(salt),w:await seal(await pwKey(u,p,b64(salt),600000),raw)};let code=null;
 if(newRec||!old){code=newCode();const rs=rnd(16);sec.ri=150000;sec.rs=b64(rs);sec.r=await seal(await kdf(normCode(code),rs,150000),raw)}else{sec.ri=old.ri;sec.rs=old.rs;sec.r=old.r}return{sec,code}}
/* ----- gravação protegida: uma fila só, sempre com o estado mais recente; o "Salvo" só aparece depois de criptografar, gravar e conferir ----- */
function persist(){if(!DEK)return Promise.resolve(false);if(STALE){staleWarn();return Promise.resolve(false)}
 SNAP={js:JSON.stringify(S),k:DEK};const p=new Promise(r=>WAITERS.push(r));if(!SAVING){SAVING=true;persistQ=pump()}return p}
async function pump(){let last=true;
 while(SNAP){const job=SNAP,ws=WAITERS;SNAP=null;WAITERS=[];let ok=false;
  try{const d=await seal(job.k,enc.encode(job.js)),o={...SECOBJ,d},str=JSON.stringify(o);localStorage.setItem(SECK,str);if(localStorage.getItem(SECK)!==str)throw new Error('conferência');SECOBJ=o;ok=true}catch(e){}
  last=ok;ws.forEach(r=>r(ok))}
 SAVING=false;const q=SAVQ;SAVQ=[];toast.now=1;try{if(!last)toast('Não foi possível salvar os dados protegidos. As últimas alterações podem não ter sido gravadas — tente novamente.',5000);else if(q.length)toast(q[q.length-1])}finally{toast.now=0}}

/* ----- controle de tentativas de acesso (senha e código de recuperação) -----
   Conta ANTES de verificar (fechar a aba no meio não escapa e tentativas paralelas não multiplicam palpites), espera progressiva
   com teto de 30 min (nunca bloqueia para sempre), guarda o estado em 3 lugares independentes (localStorage, IndexedDB e Cache)
   e usa sempre o mais restritivo: apagar só um deles não zera nada. A espera diminui sozinha com o tempo sem tentativas.
   Não toca em senha, chaves, código de recuperação nem nos dados. */
const GDB='wallstreet-guard',GCN='wallstreet-guard-state',GMAX=1800,GSCHED=[0,0,0,15,30,60,120,300,600,900,1800];
let GST={p:{n:0,u:0,t:0},r:{n:0,u:0,t:0}},GREADY=Promise.resolve();
const fmtW=s=>s<60?s+'s':Math.floor(s/60)+'min'+(s%60?' '+(s%60)+'s':'');
const gUrl=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'__guard';
function gMerge(list){const o={p:{n:0,u:0,t:0},r:{n:0,u:0,t:0}};
 for(const x of list){if(!x||typeof x!=='object')continue;const q=(x.p||x.r)?x:{p:x};
  for(const k of ['p','r']){const a=q[k];if(a&&typeof a==='object'&&Number.isFinite(a.n)&&a.n>0){o[k].n=Math.max(o[k].n,Math.min(a.n|0,99));if(Number.isFinite(a.u))o[k].u=Math.max(o[k].u,a.u);if(Number.isFinite(a.t))o[k].t=Math.max(o[k].t,a.t)}}}
 return o}
function gEff(k,now){const a=GST[k],q=now-a.t;let n=a.n;if(a.t>0&&q>=0){if(q>=864e5)n=Math.min(n,2);else if(q>=72e5)n=Math.min(n,6)}return{n,u:Math.min(a.u,now+GMAX*1000)}}   // espera/contagem efetivas: sem tentativas por horas, volta a ser leve; valor absurdo vira no máximo 30 min
const gWaitS=k=>{const e=gEff(k,Date.now());return Math.max(0,Math.ceil((e.u-Date.now())/1000))};
const failWait=()=>gWaitS('p');
const gLsRead=()=>{try{return JSON.parse(localStorage.getItem(FK))}catch(e){return null}};
const gIDB=()=>new Promise((ok,no)=>{try{const r=indexedDB.open(GDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('g');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const gIdbGet=async()=>{try{const d=await gIDB();return await new Promise(ok=>{const q=d.transaction('g').objectStore('g').get('s');q.onsuccess=()=>{d.close();ok(q.result||null)};q.onerror=()=>{d.close();ok(null)}})}catch(e){return null}};
const gIdbSet=async v=>{try{const d=await gIDB();return await new Promise(ok=>{const t=d.transaction('g','readwrite'),s=t.objectStore('g');if(v===null)s.delete('s');else s.put(v,'s');t.oncomplete=()=>{d.close();ok(true)};t.onerror=t.onabort=()=>{d.close();ok(false)}})}catch(e){return false}};
const gCacheGet=async()=>{try{const c=await caches.open(GCN),r=await c.match(gUrl());return r?await r.json():null}catch(e){return null}};
const gCacheSet=async v=>{try{const c=await caches.open(GCN);if(v===null)await c.delete(gUrl());else await c.put(gUrl(),new Response(JSON.stringify(v)));return true}catch(e){return false}};
async function gLoad(){const a=gLsRead(),[b,c]=await Promise.all([gIdbGet(),gCacheGet()]);GST=gMerge([a,b,c]);

  if(JSON.stringify(b)!==j)gIdbSet({v:2,...GST});if(JSON.stringify(c)!==j)gCacheSet({v:2,...GST})}}      // se alguém apagou um dos três, é restaurado a partir dos outros
async function gSave(){const v={v:2,...GST};try{localStorage.setItem(FK,JSON.stringify(v))}catch(e){}await Promise.all([gIdbSet(v),gCacheSet(v)])}
async function gClear(){GST={p:{n:0,u:0,t:0},r:{n:0,u:0,t:0}};try{localStorage.removeItem(FK)}catch(e){}await Promise.all([gIdbSet(null),gCacheSet(null)])}
/* reserva uma tentativa: {wait} se ainda há espera (nada é verificado nem contado); senão conta a tentativa e libera */
async function gTry(k){await GREADY;await gLoad();const now=Date.now(),e=gEff(k,now),w=Math.max(0,Math.ceil((e.u-now)/1000));if(w>0)return{wait:w};

function tourPlace(els,sp,cd){const rs=els.map(e=>e.getBoundingClientRect()),L=Math.min(...rs.map(r=>r.left)),T=Math.min(...rs.map(r=>r.top)),Rr=Math.max(...rs.map(r=>r.right)),B=Math.max(...rs.map(r=>r.bottom)),pd=6;

 o.inst.forEach((i,x)=>{if(!obj(i))return E.push('o parcelado nº '+(x+1)+' está danificado');if(i.n!=null&&typeof i.n!=='string')E.push('o parcelado nº '+(x+1)+' tem nome inválido');if(i.c!=null&&!bkM(i.c))E.push('o parcelado "'+bkTx(i.n)+'" tem valor inválido')});
 o.parc.forEach((p,x)=>{if(!obj(p))return E.push('a parcela nº '+(x+1)+' está danificada');if(!bkM(p.c))E.push('a parcela nº '+(x+1)+' tem valor inválido');if(!BKYM.test(p.ym||''))E.push('a parcela nº '+(x+1)+' tem mês inválido');if(p.due!=null&&p.due!==''&&!BKDT.test(p.due))E.push('a parcela nº '+(x+1)+' tem vencimento inválido')});
 o.debts.forEach((d,x)=>{if(!obj(d))return E.push('a dívida nº '+(x+1)+' está danificada');const w='a dívida "'+bkTx(d.n)+'" (nº '+(x+1)+')';if(!bkM(d.o))E.push(w+' tem valor inválido');if(d.n!=null&&typeof d.n!=='string')E.push(w+' tem nome inválido');
  if(d.due!=null&&d.due!==''&&!BKDT.test(d.due))E.push(w+' tem vencimento inválido');if(!Array.isArray(d.pays)||d.pays.some(p=>!obj(p)||!bkM(p.c,1)||!BKDT.test(p.d||'')))E.push(w+' tem pagamentos inválidos')});
 o.boxes.forEach((b,x)=>{if(!obj(b))return E.push('a caixinha nº '+(x+1)+' está danificada');const w='a caixinha "'+bkTx(b.n)+'" (nº '+(x+1)+')';if(b.n!=null&&typeof b.n!=='string')E.push(w+' tem nome inválido');

 (o.cards||[]).forEach((k,x)=>{if(!obj(k))return E.push('o cartão nº '+(x+1)+' está danificado');const w='o cartão "'+bkTx(k.n)+'" (nº '+(x+1)+')';if(typeof k.n!=='string')E.push(w+' tem nome inválido');if(!bkM(k.lim))E.push(w+' tem limite inválido');if(!bkDay(k.cl)||!bkDay(k.dd))E.push(w+' tem dia de fechamento/vencimento inválido');

const bkCnt=x=>({inc:x.items.filter(i=>i.t==='inc').length,exp:x.items.filter(i=>i.t==='exp').length,debts:x.debts.length,parc:x.parc.length,boxes:x.boxes.length,cards:(x.cards||[]).length});

/* verifica TUDO antes de mexer em qualquer dado: devolve {err} | {same} | {n (cópia já normalizada), msg, sig, resumo} */
async function bkpPrepare(o,meta,welcome){const fail=m=>({err:'Backup inválido: '+m+'. Seus dados atuais não foram alterados.'});
 const {E,W}=bkpCheck(o);if(E.length)return fail(E[0]+(E.length>1?' (e mais '+(E.length-1)+(E.length>2?' problemas)':' problema)'):''));
 const mt=o.__backup;
 if(mt!=null){if(!mt||typeof mt!=='object'||Array.isArray(mt))return fail('o selo de integridade está danificado');
  if(typeof mt.sum==='string'){const {__backup,...rest}=o,al=mt.sum.split(':')[0];if(al==='fnv'||(al==='sha256'&&typeof crypto!=='undefined'&&crypto.subtle)){if(await bkpHash(JSON.stringify(rest),al)!==mt.sum)return fail('o arquivo foi alterado ou está corrompido (a verificação de integridade falhou)')}}}
 let n;try{n=JSON.parse(JSON.stringify(o))}catch(e){return fail('não foi possível ler o conteúdo')}
 delete n.__backup;if(!valid(n)||typeof n.owner!=='string')return fail('os dados não passaram na verificação de estrutura');
 migrate(n);if(!n.pref||typeof n.pref!=='object')n.pref=S.pref;fixPref(n);
 const sig=await bkpSig(n);if(!welcome&&sig===await bkpSig(S))return{same:true};
 const a=bkCnt(n),b=bkCnt(S),at=(meta&&meta.at)||(mt&&typeof mt.at==='string'?mt.at.slice(0,10):''),ws=W.slice();
 [['inc','receitas'],['exp','despesas'],['debts','dívidas'],['parc','parcelas'],['boxes','caixinhas'],['cards','cartões']].forEach(([k,t])=>{if(b[k]>a[k])ws.push('o backup tem menos '+t+' ('+a[k]+') do que os seus dados atuais ('+b[k]+')')});
 const lb=S.flags&&S.flags.bkpAt;if(BKDT.test(at)&&BKDT.test(lb||'')&&at<lb)ws.push('ele é mais antigo que o seu último backup ('+dmy(lb)+')');
 const ja=((S.flags&&Array.isArray(S.flags.imp))?S.flags.imp:[]).find(x=>x&&x.h===sig);if(ja)ws.push('você já importou este mesmo backup em '+dmy(ja.at));
 const resumo=bkRes(a);
 const msg='Importar o backup'+(BKDT.test(at)?' de '+dmy(at):'')+' de "'+(n.owner||'sem nome')+'" ('+resumo+')? Seus dados atuais ('+bkRes(b)+') serão SUBSTITUÍDOS e isso não pode ser desfeito.'+(ws.length?' Atenção: '+ws.join('; ')+'.':'')+' Continuar?';
 return{n,sig,msg,resumo}}
/* aplica de uma vez; se gravar falhar, volta tudo como estava */
async function bkpApply(r){if(IMPBUSY)return;IMPBUSY=1;const prev=S,prevOpen=open;
 try{const n=r.n;n.flags=(n.flags&&typeof n.flags==='object')?n.flags:{};n.flags.bkpAt=todayStr();n.flags.imp=[{h:r.sig,at:todayStr()},...((prev.flags&&Array.isArray(prev.flags.imp))?prev.flags.imp:[])].slice(0,6);
  S=n;open={};const nw=achCheck();let okS=false;try{okS=SECMODE?(DEK?await persist():false):save()}catch(e){okS=false}
  if(!okS){S=prev;open=prevOpen;render();toast('A importação foi cancelada: não foi possível gravar. Seus dados atuais foram mantidos.',6000);return}
  render();toast('Backup importado ✓ — '+r.resumo,5000);if(nw.length)celebrate(nw)}
 catch(e){S=prev;open=prevOpen;try{render()}catch(x){}toast('A importação foi cancelada por um erro. Seus dados atuais foram mantidos.',6000)}
 finally{IMPBUSY=0}}
async function importObj(o,meta){if(IMPBUSY)return toast('Já existe uma importação em andamento.');IMPBUSY=1;let r;

function importEnc(o){if(!hasCrypto)return toast('Este navegador não consegue abrir backups criptografados (precisa de https).');
 if(!(Number.isInteger(o.it)&&o.it>=100000&&o.it<=2000000)||typeof o.s!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string')return toast('Backup criptografado danificado ou incompleto. Seus dados atuais não foram alterados.',6000);

  try{d=JSON.parse(dec.decode(await unseal(await kdf(np(v.p),ub64(o.s),o.it),{iv:o.iv,ct:o.ct})))}catch(e){return'Senha incorreta ou arquivo corrompido.'}finally{secBusy=false}
  setTimeout(()=>importObj(d,{at:o.at}),60)})}
